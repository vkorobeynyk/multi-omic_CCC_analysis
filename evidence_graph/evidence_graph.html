  .lit .sum { margin-top: 6px; padding-top: 6px; border-top: 1px dashed #c9d3e0; color: #222; }

<script>
const networks = [{"name":"Igfbpl1 -> Dcc","nodes":[{"id":"Igfbpl1","label":"Igfbpl1","shape":"ellipse","info":{"title":"Igfbpl1","fields":{"role":"ligand","sender":"Neurogenic_lineage"}},"color":{"background":"#dbe9f6","border":"#2a78d6"},"font":{"size":22}},{"id":"Dcc","label":"Dcc","shape":"ellipse","info":{"title":"Dcc","fields":{"role":"receptor","receiver":"GC"}},"color":{"background":"#dbe9f6","border":"#2a78d6"},"font":{"size":22}},{"id":"pair:Igfbpl1 -> Dcc","label":"interaction","shape":"dot","info":{"title":"Igfbpl1 -> Dcc","fields":{"sender":"Neurogenic_lineage","receiver":"GC","verdict":"The modalities do not agree on how Igfbpl1–Dcc signalling changes with age: Visium suggests a loss of the LR–colocalisation relationship in old tissue, liana+ Moran’s I shows a slight increase that is no stronger than random gene pairs, and stLearn shows no clear change. The most robust single result is the moderate decrease of DCC protein in old mouse hippocampus, supported by a weak trend in human DG and CA1. IGFBPL1 is barely detected in STARmap PLUS and not detected by proteomics. Overall, the evidence for an age-dependent Igfbpl1–Dcc interaction is weak; a staining should first test whether both proteins are detectable and adjacent in the DG (e.g. in Dcx+ neuroblasts), before comparing young and old.\n","comments":""},"literature":[{"citation":"Tawarayama H, Yamada H, Amin R, et al. Draxin regulates hippocampal neurogenesis in the postnatal dentate gyrus by inhibiting DCC-induced apoptosis. Sci Rep 8, 840 (2018)","link":"https://doi.org/10.1038/s41598-018-19346-6","summary":"Draxin, a DCC ligand, protects newborn neurons in the postnatal DG from DCC-induced apoptosis (DCC acts as a dependence receptor); without draxin, more DCC-expressing neuroblasts die and neurogenesis is reduced."}]},"color":{"background":"#333333","border":"#333333"},"font":{"size":12}},{"id":"tech:Visium (spot based)","label":"Visium (spot based)","shape":"box","info":{"title":"Visium (spot based)","fields":{"citation":""},"links":[]},"color":{"background":"#e3f2e1","border":"#2e7d32"},"font":{"size":14}},{"id":"tech:STARmap PLUS (liana Moran's I)","label":"STARmap PLUS (liana Moran's I)","shape":"box","info":{"title":"STARmap PLUS (liana Moran's I)","fields":{"citation":""},"links":[]},"color":{"background":"#e3f2e1","border":"#2e7d32"},"font":{"size":14}},{"id":"tech:STARmap PLUS (stLearn)","label":"STARmap PLUS (stLearn)","shape":"box","info":{"title":"STARmap PLUS (stLearn)","fields":{"citation":""},"links":[]},"color":{"background":"#e3f2e1","border":"#2e7d32"},"font":{"size":14}},{"id":"tech:Proteomics (mouse, Huang 2024)","label":"Proteomics (mouse, Huang 2024)","shape":"box","info":{"title":"Proteomics (mouse, Huang 2024)","fields":{"citation":"Huang H, van Waardenberg AJ, Graham ME, Anggono V, Widagdo J. Global quantitative proteomic analysis of aged mouse hippocampus. Proteomics 24(7):2300276 (2024)"},"links":[{"label":"Paper","url":"https://doi.org/10.1002/pmic.202300276"}]},"color":{"background":"#efe6f8","border":"#6a3fa0"},"font":{"size":14}},{"id":"tech:Proteomics (human, Mol 2022)","label":"Proteomics (human, Mol 2022)","shape":"box","info":{"title":"Proteomics (human, Mol 2022)","fields":{"citation":"Mol P, Chatterjee O, Gopalakrishnan L, et al., Prasad TSK. Age-associated molecular changes in human hippocampus subfields as determined by quantitative proteomics. OMICS 26(7):382-391 (2022)"},"links":[{"label":"Paper","url":"https://doi.org/10.1089/omi.2022.0053"}]},"color":{"background":"#efe6f8","border":"#6a3fa0"},"font":{"size":14}}],"edges":[{"id":1,"from":"Igfbpl1","to":"pair:Igfbpl1 -> Dcc","label":"","color":{"color":"#333333"},"info":null,"arrows":"","dashes":false,"width":5,"length":160},{"id":2,"from":"pair:Igfbpl1 -> Dcc","to":"Dcc","label":"","color":{"color":"#333333"},"info":null,"arrows":"to","dashes":false,"width":5,"length":160},{"id":3,"from":"tech:Visium (spot based)","to":"pair:Igfbpl1 -> Dcc","label":"LR-colocalisation coupling lost with age","color":{"color":"#0072b2"},"info":{"title":"Visium (spot based) -> Igfbpl1 -> Dcc","fields":{"effect":"decrease","samples":"In-house Visium spot data - 4 young, 4 middle, 4 old1 and 4 old2 sections","method":"RCTD deconvolution and correlation of LR expression with cell-type colocalisation","description":"Found in the Neurogenic_lineage–GC (granule cell) interaction, based on RCTD deconvolution. Where Neurogenic_lineage–GC colocalisation is higher, LR expression is lower. From young to old samples the relationship changes: in young samples LR expression increases with colocalisation, whereas in old samples it is almost 0. This suggests that these cells might no longer interact in old tissue. Note that a Visium spot (~55 µm) contains several cells and neurogenesis declines strongly with age, so fewer neurogenic cells per spot in old tissue could also contribute to the loss of signal.\n"},"reports":["../03c_crossModality_plots.html"]},"arrows":"to","dashes":false,"width":2,"length":270},{"id":4,"from":"tech:STARmap PLUS (liana Moran's I)","to":"pair:Igfbpl1 -> Dcc","label":"higher at 13 mo, but at random-pair level","color":{"color":"#c9a227"},"info":{"title":"STARmap PLUS (liana Moran's I) -> Igfbpl1 -> Dcc","fields":{"effect":"weak","samples":"STARmap PLUS (Zeng et al., Nat Neurosci 2023; SCP1375), control mice only, 8 and 13 months, 2 sections each (35,771 cells)","method":"liana+ bivariate Moran’s I","description":"With liana+ bivariate Moran’s I, the local scores of this interaction are found mostly within the DG (dentate gyrus), with a mix of positive and negative values. Positive local scores mean high–high or low–low (both genes on the same side of the section average); negative scores mean high–low or low–high. Across all cells, the two genes are expressed mostly in CA regions and inhibitory neurons, but overall normalised expression is very low (0.05–0.25), and Igfbpl1 is detected in only ~1% of cells. In the literature, DCC affects neuroblast survival, but through other ligands (netrin-1, draxin). Since neuroblasts are a very small population in the GCL, a strong overall signal is not expected. Across age, both 13-month samples have a higher global Moran’s I than the 8-month samples (communication increases with age), but the score is very low (~0.01) and similar to that of detection-matched random gene pairs (negative control). Note that in STARmap PLUS “old” means 13 months, which is closer to middle age in the other datasets.\n"},"reports":["../09_STARmapPLUS_BivariateMoransI.html","../10_STARmapPLUS_BivariateMoransI_AgeComparison.html"]},"arrows":"to","dashes":false,"width":2,"length":270},{"id":5,"from":"tech:STARmap PLUS (stLearn)","to":"pair:Igfbpl1 -> Dcc","label":"intermixed, few significant cells","color":{"color":"#999999"},"info":{"title":"STARmap PLUS (stLearn) -> Igfbpl1 -> Dcc","fields":{"effect":"no_change","samples":"STARmap PLUS (Zeng et al., Nat Neurosci 2023; SCP1375), control mice only, 8 and 13 months, 2 sections each (35,771 cells)","method":"stLearn","description":"The share of cells with a significant LR score is low, below the median of all database LR pairs; only 20 cells are significant in the dataset. Since this interaction may be restricted to neuroblasts, a large signal is not expected. Across age (8 vs 13 months) the samples are intermixed and their values very close, so there is no clear direction. Within the DG, the 13-month samples seem to have fewer cell–neighbour interactions than the 8-month samples (suggesting that communication decreases with age), whereas in CA1 they increase. These are small absolute numbers without a statistical test, so they are descriptive only.\n"},"reports":["../09b_STARmapPLUS_stlearn.html","../10b_STARmapPLUS_stlearn_Age_comparison.html"]},"arrows":"to","dashes":false,"width":2,"length":270},{"id":6,"from":"tech:Proteomics (mouse, Huang 2024)","to":"Dcc","label":"lower in old (log2FC -0.12, adj.P 0.01)","color":{"color":"#0072b2"},"info":{"title":"Proteomics (mouse, Huang 2024) -> Dcc","fields":{"effect":"decrease","samples":"Whole hippocampus, 3 vs 20 months, n = 5 per group, limma statistics from the paper","method":"TMT mass spectrometry; limma statistics from the paper","description":"DCC protein levels are lower in old (20 months) than in young (3 months) samples (log2FC −0.117, adj.P 0.01), with all old samples showing lower abundance. Compared with all proteins in the dataset (median log2FC −0.015; central 95%: [−0.213, +0.288]), −0.117 is a moderate decrease (11th percentile). IGFBPL1 is not detected, i.e. it is below the detection limit of the method, which does not mean it is absent.\n"},"reports":["../11_Proteomics_LR_AgeTrends.html"]},"arrows":"to","dashes":false,"width":2,"length":270},{"id":7,"from":"tech:Proteomics (mouse, Huang 2024)","to":"Igfbpl1","label":"not detected","color":{"color":"#cccccc"},"info":{"title":"Proteomics (mouse, Huang 2024) -> Igfbpl1","fields":{"effect":"not_detected","samples":"Whole hippocampus, 3 vs 20 months, n = 5 per group","method":"TMT mass spectrometry; limma statistics from the paper","description":"DCC protein levels are lower in old (20 months) than in young (3 months) samples (log2FC −0.117, adj.P 0.01), with all old samples showing lower abundance. Compared with all proteins in the dataset (median log2FC −0.015; central 95%: [−0.213, +0.288]), −0.117 is a moderate decrease (11th percentile). IGFBPL1 is not detected, i.e. it is below the detection limit of the method, which does not mean it is absent.\n"},"reports":["../11_Proteomics_LR_AgeTrends.html"]},"arrows":"to","dashes":false,"width":2,"length":245},{"id":8,"from":"tech:Proteomics (human, Mol 2022)","to":"Dcc","label":"lower in DG and CA1 only (descriptive)","color":{"color":"#c9a227"},"info":{"title":"Proteomics (human, Mol 2022) -> Dcc","fields":{"effect":"weak","samples":"5 subfields (DG, CA1-CA4), age groups 1-10, 21-30, 31-40, 81-90 y; one pooled value per group, so descriptive only","method":"TMT mass spectrometry of microdissected FFPE subfields; descriptive comparison","description":"DCC protein levels tend to be lower in old (81–90 y) than in young (1–10 y) samples, in the same direction as in mouse but only weakly: log2FC ranges from +0.03 to −0.18. The decrease is seen in DG and CA1, while in CA2, CA3 and CA4 the change is negligible. With one pooled value per age group there is no statistical test, so this is a weak, descriptive trend. The DG/CA1-specific pattern resembles the region differences seen with stLearn in STARmap PLUS, although those measure spatial co-expression, not protein amount.\n"},"reports":["../11_Proteomics_LR_AgeTrends.html"]},"arrows":"to","dashes":false,"width":2,"length":270},{"id":9,"from":"tech:Proteomics (human, Mol 2022)","to":"Igfbpl1","label":"not detected","color":{"color":"#cccccc"},"info":{"title":"Proteomics (human, Mol 2022) -> Igfbpl1","fields":{"effect":"not_detected","samples":"5 subfields (DG, CA1-CA4), age groups 1-10, 21-30, 31-40, 81-90 y; one pooled value per group","method":"TMT mass spectrometry of microdissected FFPE subfields; descriptive comparison","description":"IGFBPL1 is not detected in any of the five human subfields (DG, CA1-CA4), i.e. it is below the detection limit of the method, which does not mean it is absent.\n"},"reports":["../11_Proteomics_LR_AgeTrends.html"]},"arrows":"to","dashes":false,"width":2,"length":245}]},{"name":"Adam10 -> Notch2","nodes":[{"id":"Adam10","label":"Adam10","shape":"ellipse","info":{"title":"Adam10","fields":{"role":"ligand","sender":"Neurogenic_lineage"}},"color":{"background":"#dbe9f6","border":"#2a78d6"},"font":{"size":22}},{"id":"Notch2","label":"Notch2","shape":"ellipse","info":{"title":"Notch2","fields":{"role":"receptor","receiver":"GC"}},"color":{"background":"#dbe9f6","border":"#2a78d6"},"font":{"size":22}},{"id":"pair:Adam10 -> Notch2","label":"interaction","shape":"dot","info":{"title":"Adam10 -> Notch2","fields":{"sender":"Neurogenic_lineage","receiver":"GC","verdict":"The spatial evidence is weak and inconsistent: in Visium the LR–colocalisation relationship reverses after young age, liana+ Moran’s I changes from negative (8 months) to positive (13 months) but stays within the range of random gene pairs, and stLearn shows no consistent age direction across replicates. In contrast, ADAM10 protein consistently increases with age: significantly in mouse hippocampus (log2FC +0.20, adj.P 0.002) and in all five human subfields (descriptive). NOTCH2 protein is not detected in either dataset. The protein increase of ADAM10 is the most robust finding.\n","comments":"ADAM10 is not a classical ligand: it is the protease that cleaves Notch (S2 cleavage), often within the same cell (in cis). Neighbour-based methods (Moran’s I, stLearn) assume signalling from one cell to its neighbours, so they may not be the right model for this pair.\n"},"literature":[{"citation":"Lampada A, Taylor V. Notch signaling as a master regulator of adult neurogenesis. Front Neurosci 17:1179011 (2023). PMID 37457009","link":"https://doi.org/10.3389/fnins.2023.1179011","summary":"Review - Notch signalling keeps adult neural stem cells in the DG and SVZ quiescent and maintains the stem cell pool, and regulates their activation and fate; individual Notch receptors and ligands have distinct roles."},{"citation":"Zhang R, Boareto M, Engler A, Louvi A, Giachino C, Iber D, Taylor V. Id4 downstream of Notch2 maintains neural stem cell quiescence in the adult hippocampus. Cell Rep 28(6):1485-1498.e6 (2019)","link":"https://doi.org/10.1016/j.celrep.2019.07.014","summary":"Notch2 (not Notch1) keeps adult hippocampal neural stem cells quiescent through its target Id4; deleting Notch2 activates quiescent stem cells and increases neurogenesis, also in the aged hippocampus."},{"citation":"Elsworthy RJ, Hill EJ, Dunleavy C, Aldred S. The role of ADAM10 in astrocytes - implications for Alzheimer's disease. Front Aging Neurosci 14:1056507 (2022)","link":"https://doi.org/10.3389/fnagi.2022.1056507","summary":"Review - astrocytes express ADAM10, and during acute reactive gliosis astrocytic ADAM10 activity, sAPPα and neurotrophic factors increase, supporting neuroprotection. \"While gliosis may increase astrocyte ADAM10 activity, it may have an inhibiting effect on neuronal ADAM10 activity. However, this is speculative and an area for future investigation.\""},{"citation":"Zhu X, Yao Y, Yang J, Zhang C, Li X, Zhang A, et al. ADAM10 suppresses demyelination and reduces seizure susceptibility in cuprizone-induced demyelination model. Free Radic Biol Med 171:26-41 (2021)","link":"https://doi.org/10.1016/j.freeradbiomed.2021.05.001","summary":"In the cuprizone demyelination model, ADAM10 overexpression suppressed demyelination, neuroinflammation and oxidative stress (via sAPPα) and reduced seizure susceptibility."}]},"color":{"background":"#333333","border":"#333333"},"font":{"size":12}},{"id":"tech:Visium (spot based)","label":"Visium (spot based)","shape":"box","info":{"title":"Visium (spot based)","fields":{"citation":""},"links":[]},"color":{"background":"#e3f2e1","border":"#2e7d32"},"font":{"size":14}},{"id":"tech:STARmap PLUS (liana Moran's I)","label":"STARmap PLUS (liana Moran's I)","shape":"box","info":{"title":"STARmap PLUS (liana Moran's I)","fields":{"citation":""},"links":[]},"color":{"background":"#e3f2e1","border":"#2e7d32"},"font":{"size":14}},{"id":"tech:STARmap PLUS (stLearn)","label":"STARmap PLUS (stLearn)","shape":"box","info":{"title":"STARmap PLUS (stLearn)","fields":{"citation":""},"links":[]},"color":{"background":"#e3f2e1","border":"#2e7d32"},"font":{"size":14}},{"id":"tech:Proteomics (mouse, Huang 2024)","label":"Proteomics (mouse, Huang 2024)","shape":"box","info":{"title":"Proteomics (mouse, Huang 2024)","fields":{"citation":"Huang H, van Waardenberg AJ, Graham ME, Anggono V, Widagdo J. Global quantitative proteomic analysis of aged mouse hippocampus. Proteomics 24(7):2300276 (2024)"},"links":[{"label":"Paper","url":"https://doi.org/10.1002/pmic.202300276"}]},"color":{"background":"#efe6f8","border":"#6a3fa0"},"font":{"size":14}},{"id":"tech:Proteomics (human, Mol 2022)","label":"Proteomics (human, Mol 2022)","shape":"box","info":{"title":"Proteomics (human, Mol 2022)","fields":{"citation":"Mol P, Chatterjee O, Gopalakrishnan L, et al., Prasad TSK. Age-associated molecular changes in human hippocampus subfields as determined by quantitative proteomics. OMICS 26(7):382-391 (2022)"},"links":[{"label":"Paper","url":"https://doi.org/10.1089/omi.2022.0053"}]},"color":{"background":"#efe6f8","border":"#6a3fa0"},"font":{"size":14}}],"edges":[{"id":1,"from":"Adam10","to":"pair:Adam10 -> Notch2","label":"","color":{"color":"#333333"},"info":null,"arrows":"","dashes":false,"width":5,"length":160},{"id":2,"from":"pair:Adam10 -> Notch2","to":"Notch2","label":"","color":{"color":"#333333"},"info":null,"arrows":"to","dashes":false,"width":5,"length":160},{"id":3,"from":"tech:Visium (spot based)","to":"pair:Adam10 -> Notch2","label":"positive in young, reversed in middle/old","color":{"color":"#c9a227"},"info":{"title":"Visium (spot based) -> Adam10 -> Notch2","fields":{"effect":"weak","samples":"In-house Visium spot data - 4 young, 4 middle, 4 old1 and 4 old2 sections","method":"RCTD deconvolution and correlation of LR expression with cell-type colocalisation","description":"In young samples, higher Neurogenic_lineage–GC colocalisation correlates with higher LR expression, but in middle and old samples the trend is opposite. CCC analysis of the scRNA-seq data (LIANA+) gave a very low score for this interaction. Note that the Visium age groups (young, middle, old) differ from the STARmap PLUS comparison (8 vs 13 months).\n"},"reports":["../03c_crossModality_plots.html"]},"arrows":"to","dashes":false,"width":2,"length":270},{"id":4,"from":"tech:STARmap PLUS (liana Moran's I)","to":"pair:Adam10 -> Notch2","label":"negative at 8 mo, positive at 13 mo; random-pair level","color":{"color":"#c9a227"},"info":{"title":"STARmap PLUS (liana Moran's I) -> Adam10 -> Notch2","fields":{"effect":"weak","samples":"STARmap PLUS (Zeng et al., Nat Neurosci 2023; SCP1375), control mice only, 8 and 13 months, 2 sections each (35,771 cells)","method":"liana+ bivariate Moran’s I","description":"This interaction reached significance in the liana+ Moran’s I test, which shuffles expression values across the tissue. Positive local scores are concentrated in glial cells and CA2: these cell types dominate the top 5% local Moran’s I cells, with Adam10 expressed highest in microglia and Notch2 in astrocytes, microglia and vascular cells. In the GCL (granule cell layer), most local scores are negative, i.e. ligand and receptor are mismatched there. Across age, the global score changes sign: both 8-month sections are negative and both 13-month sections are positive, so the two ages separate cleanly. However, the values are very low and within the range of detection-matched random control pairs.\n"},"reports":["../09_STARmapPLUS_BivariateMoransI.html","../10_STARmapPLUS_BivariateMoransI_AgeComparison.html"]},"arrows":"to","dashes":false,"width":2,"length":295},{"id":5,"from":"tech:STARmap PLUS (stLearn)","to":"pair:Adam10 -> Notch2","label":"many significant cells, not above matched pairs; intermixed","color":{"color":"#999999"},"info":{"title":"STARmap PLUS (stLearn) -> Adam10 -> Notch2","fields":{"effect":"no_change","samples":"STARmap PLUS (Zeng et al., Nat Neurosci 2023; SCP1375), control mice only, 8 and 13 months, 2 sections each (35,771 cells)","method":"stLearn","description":"The share of cells with a significant LR score is high: in 13months_replicate_1, Adam10–Notch2 is at the 94th percentile of all database pairs. However, Adam10 is very widely expressed, which helps it reach significance in many cells; compared with the 50 database pairs with the most similar detection, it is not higher (detection-matched p = 0.14 in this section; combined across the 4 sections p = 0.075, BH-adjusted p = 0.19). The signal is not only concentrated in the GCL but also in the molecular layer, following the expression in glial cell types, so there might be some vascular/glial interactions. Across age, DG–DG cell–neighbour pairs drop from ~38 (8 months) to ~22 (13 months), suggesting that the interaction decreases with age, but across replicates the signal is intermixed, so there is no consistent age direction.\n"},"reports":["../09b_STARmapPLUS_stlearn.html","../10b_STARmapPLUS_stlearn_Age_comparison.html"]},"arrows":"to","dashes":false,"width":2,"length":295},{"id":6,"from":"tech:Proteomics (mouse, Huang 2024)","to":"Adam10","label":"higher in old (log2FC +0.20, adj.P 0.002)","color":{"color":"#d55e00"},"info":{"title":"Proteomics (mouse, Huang 2024) -> Adam10","fields":{"effect":"increase","samples":"Whole hippocampus, 3 vs 20 months, n = 5 per group, limma statistics from the paper","method":"TMT mass spectrometry; limma statistics from the paper","description":"Among the LR genes analysed, ADAM10 shows the strongest significant increase with age (log2FC +0.203, adj.P 0.002; around the 95th percentile of all proteins), and all old replicates are higher than all young ones.\n"},"reports":["../11_Proteomics_LR_AgeTrends.html"]},"arrows":"to","dashes":false,"width":2,"length":270},{"id":7,"from":"tech:Proteomics (mouse, Huang 2024)","to":"Notch2","label":"not detected","color":{"color":"#cccccc"},"info":{"title":"Proteomics (mouse, Huang 2024) -> Notch2","fields":{"effect":"not_detected","samples":"Whole hippocampus, 3 vs 20 months, n = 5 per group","method":"TMT mass spectrometry; limma statistics from the paper","description":"NOTCH2 protein is not detected, i.e. it is below the detection limit of the method."},"reports":["../11_Proteomics_LR_AgeTrends.html"]},"arrows":"to","dashes":false,"width":2,"length":245},{"id":8,"from":"tech:Proteomics (human, Mol 2022)","to":"Adam10","label":"higher in old in all 5 subfields (descriptive)","color":{"color":"#d55e00"},"info":{"title":"Proteomics (human, Mol 2022) -> Adam10","fields":{"effect":"increase","samples":"5 subfields (DG, CA1-CA4), age groups 1-10, 21-30, 31-40, 81-90 y; one pooled value per group, so descriptive only","method":"TMT mass spectrometry of microdissected FFPE subfields; descriptive comparison","description":"ADAM10 protein levels are higher in old (81–90 y) than in young (1–10 y) samples in all five hippocampal subfields (percentiles 76–91 among all proteins). With one pooled value per age group this is a descriptive trend.\n"},"reports":["../11_Proteomics_LR_AgeTrends.html"]},"arrows":"to","dashes":false,"width":2,"length":295},{"id":9,"from":"tech:Proteomics (human, Mol 2022)","to":"Notch2","label":"not detected","color":{"color":"#cccccc"},"info":{"title":"Proteomics (human, Mol 2022) -> Notch2","fields":{"effect":"not_detected","samples":"5 subfields (DG, CA1-CA4), age groups 1-10, 21-30, 31-40, 81-90 y","method":"TMT mass spectrometry of microdissected FFPE subfields; descriptive comparison","description":"NOTCH2 protein is not detected in any subfield."},"reports":["../11_Proteomics_LR_AgeTrends.html"]},"arrows":"to","dashes":false,"width":2,"length":245}]}];
const sel = document.getElementById("pair"), panel = document.getElementById("panel");
networks.forEach((n, i) => sel.add(new Option(n.name, i)));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
function showInfo(info) {
  if (!info) { panel.innerHTML = "<i>No details for this element.</i>"; return; }
  let h = "<h3>" + esc(info.title) + "</h3>";
  for (const [k, v] of Object.entries(info.fields || {})) if (v) h += "<div class=f><b>" + esc(k) + ":</b> " + esc(v) + "</div>";
  for (const l of [].concat(info.links || [])) h += "<div class=f><b>" + esc(l.label) + ":</b> <a href=\"" + esc(l.url) + "\" target=_blank>" + esc(l.url) + "</a></div>";
  const lit = [].concat(info.literature || []);
  if (lit.length) h += "<div class=f><b>Literature:</b></div>" + lit.map(l =>
    "<div class=lit><div class=cit>" + esc(l.citation) +
    (l.link ? " <a href=\"" + esc(l.link) + "\" target=_blank>[link]</a>" : "") + "</div>" +
    (l.summary ? "<div class=sum><b>Summary:</b> " + esc(l.summary) + "</div>" : "") + "</div>").join("");
  const reps = [].concat(info.reports || []);
  if (reps.length) h += "<div class=f><b>Reports:</b><br>" + reps.map(r => "<a href=\"" + esc(r) + "\" target=_blank>" + esc(r) + "</a>").join("<br>") + "</div>";
  panel.innerHTML = h;
}
let net = null;
function show(i) {
  const n = networks[i];
  const nodes = new vis.DataSet(n.nodes), edges = new vis.DataSet(n.edges);
  if (net) net.destroy();
  net = new vis.Network(document.getElementById("graph"), { nodes, edges }, {
    physics: { solver: "forceAtlas2Based",
               forceAtlas2Based: { springLength: 220, gravitationalConstant: -250, avoidOverlap: 0.6 },
               stabilization: { iterations: 500 } },
    edges: { font: { size: 12, align: "horizontal", background: "white", strokeWidth: 0 },
             widthConstraint: { maximum: 160 }, smooth: { type: "continuous" } },
    layout: { randomSeed: 1 },
    nodes: { size: 14 },
    interaction: { hover: true }
  });
  net.on("click", p => {
    if (p.nodes.length) showInfo(nodes.get(p.nodes[0]).info);
    else if (p.edges.length) showInfo(edges.get(p.edges[0]).info);
  });
  const pairNode = n.nodes.find(x => x.id.startsWith("pair:"));
  if (pairNode && pairNode.info.fields.verdict) showInfo(pairNode.info);
  else panel.innerHTML = "<i>Click a node or an arrow for details.</i>";
}
sel.onchange = () => show(sel.value);
show(0);
</script></body></html>
